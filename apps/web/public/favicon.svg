<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Pixel star on the Stellar dark space background -->
  <rect width="64" height="64" fill="#0d0d2b" />
  <rect x="8" y="8" width="48" height="48" fill="#1a1a2e" />
  <rect x="14" y="14" width="36" height="36" fill="#7b5ea7" />
  <!-- Gold pixel star (4-point) -->
  <rect x="30" y="14" width="4" height="8" fill="#ffd700" />
  <rect x="30" y="22" width="4" height="4" fill="#ffd700" />
  <rect x="22" y="30" width="4" height="4" fill="#e8d5b7" />
  <rect x="26" y="26" width="4" height="4" fill="#e8d5b7" />
  <rect x="34" y="26" width="4" height="4" fill="#e8d5b7" />
  <rect x="38" y="30" width="4" height="4" fill="#e8d5b7" />
  <rect x="30" y="34" width="4" height="4" fill="#e8d5b7" />
  <rect x="30" y="42" width="4" height="8" fill="#ffd700" />
  <!-- Corner studs -->
  <rect x="14" y="14" width="4" height="4" fill="#e8d5b7" />
  <rect x="46" y="14" width="4" height="4" fill="#e8d5b7" />
  <rect x="14" y="46" width="4" height="4" fill="#e8d5b7" />
  <rect x="46" y="46" width="4" height="4" fill="#e8d5b7" />
</svg>