name: CI

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code-quality:
    name: Code Quality & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify code formatting
        run: npm run format:check

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type check monorepo
        run: npm run typecheck

      - name: Lint codebase
        run: npm run lint

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run test suite
        run: npm run test

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/stub"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_stub"
      CLERK_SECRET_KEY: "sk_test_stub"
      NEXT_PUBLIC_STELLAR_NETWORK: "testnet"
      NEXT_PUBLIC_STELLAR_HORIZON_URL: "https://horizon-testnet.stellar.org"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      UPSTASH_REDIS_REST_URL: "https://stub.upstash.io"
      UPSTASH_REDIS_REST_TOKEN: "stub"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build Next.js application
        run: npm run build
